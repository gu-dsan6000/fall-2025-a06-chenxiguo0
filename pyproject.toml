[project]
name = "assignment-spark-cluster"
version = "0.1.0"
description = "Default template for Pyspark on AWS"
authors = [
    { name = "Chenxi Guo", email = "chenxiguo0@gmail.com" }
]
dependencies = [
    "pyspark==4.0.0", # Updated to match Spark 4.0.1 on cluster
    "uv==0.1.37",
    "pandas==2.2.2",
    "matplotlib==3.9.0", # Added for visualization
    "seaborn==0.13.2",   # Added for visualization
]
readme = "README.md"
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/assignment_spark_cluster"]
